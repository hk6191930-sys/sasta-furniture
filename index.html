<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#2c3e50;color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:99}
header h1{font-size:22px}
.top-btns{display:flex;gap:10px;padding:10px}
.top-btns button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:bold;cursor:pointer}
.btn-admin{background:#e67e22;color:#fff}
.btn-wa{background:#25D366;color:#fff}
#products{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.card img{width:100%;height:150px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:15px}
.price{color:#e67e22;font-weight:bold;font-size:16px;margin-top:4px}
.card-body button{width:100%;margin-top:8px;padding:10px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
#adminLogin,#adminPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:999;overflow-y:auto;padding:15px}
.box{background:#fff;border-radius:15px;padding:20px;max-width:450px;margin:20px auto}
.box h2{text-align:center;margin-bottom:15px}
.box input,.box textarea{width:100%;padding:12px;margin-bottom:10px;border:1px solid #ddd;border-radius:10px;font-size:15px}
